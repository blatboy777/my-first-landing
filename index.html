<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Blatboy — Web Developer</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        :root{--primary:#11998e;--accent:#38ef7d;--dark:#1a1a2e;--text:#333;--light:#f8f9fa}
        body{font-family:'Segoe UI',system-ui,sans-serif;line-height:1.6;color:var(--text)}
        nav{position:fixed;top:0;width:100%;background:rgba(255,255,255,.95);backdrop-filter:blur(10px);padding:1rem 2rem;z-index:1000;box-shadow:0 2px 20px rgba(0,0,0,.1)}
        .nav-container{max-width:1200px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;position:relative}
        .logo{font-weight:bold;font-size:1.3rem;color:var(--primary)}
        .nav-right{display:flex;align-items:center;gap:1rem}
        .lang-switcher{position:relative}
        .lang-btn{background:none;border:2px solid var(--primary);color:var(--primary);padding:6px 14px;border-radius:20px;font-weight:600;cursor:pointer;font-size:.85rem;display:flex;align-items:center;gap:6px;transition:all .3s}
        .lang-btn:hover{background:var(--primary);color:#fff}
        .lang-dropdown{display:none;position:absolute;top:45px;right:0;background:#fff;border-radius:12px;box-shadow:0 10px 40px rgba(0,0,0,.15);overflow:hidden;min-width:140px;z-index:1001}
        .lang-dropdown.show{display:block}
        .lang-option{padding:12px 16px;cursor:pointer;transition:background .2s;display:flex;align-items:center;gap:10px;font-size:.9rem;border-bottom:1px solid #f0f0f0}
        .lang-option:last-child{border-bottom:none}
        .lang-option:hover{background:var(--light)}
        .lang-option.active{background:var(--primary);color:#fff}
        .flag{font-size:1.1rem}
        .hamburger{display:block;background:none;border:none;font-size:1.8rem;cursor:pointer;color:var(--primary)}
        .links{display:none;position:absolute;top:60px;left:0;width:100%;background:#fff;flex-direction:column;padding:1rem 2rem;box-shadow:0 10px 30px rgba(0,0,0,.1)}
        .links.active{display:flex}
        .links a{margin:.5rem 0;padding:.5rem 0;text-decoration:none;color:#555;font-weight:500;border-bottom:1px solid #eee;transition:color .3s}
        .links a:hover{color:var(--primary)}
        .hero{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--primary) 0%,var(--accent) 100%);color:#fff;text-align:center;padding:6rem 2rem 2rem}
        .hero h1{font-size:2.8rem;margin-bottom:1rem;text-shadow:2px 2px 4px rgba(0,0,0,.2)}
        .hero p{font-size:1.2rem;opacity:.95;max-width:600px;margin:0 auto 2rem}
        .btn{display:inline-block;padding:15px 40px;background:#fff;color:var(--primary);text-decoration:none;border-radius:50px;font-weight:bold;transition:transform .3s,box-shadow .3s}
        .btn:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(0,0,0,.3)}
        section{padding:5rem 2rem;max-width:1200px;margin:0 auto}
        section h2{font-size:2.3rem;text-align:center;margin-bottom:3rem;color:#222}
        .about{background:var(--light)}
        .about-content{display:grid;grid-template-columns:1fr;gap:2rem;text-align:center}
        .about-card{background:#fff;padding:2rem;border-radius:20px;box-shadow:0 5px 30px rgba(0,0,0,.08)}
        .about-card h3{color:var(--primary);margin-bottom:1rem;font-size:1.2rem}
        .services-grid{display:grid;grid-template-columns:1fr;gap:2rem}
        .service-card{background:#fff;border:2px solid #e9ecef;padding:2.5rem;border-radius:20px;text-align:center;transition:transform .3s,border-color .3s}
        .service-card:hover{transform:translateY(-5px);border-color:var(--primary)}
        .service-card .icon{font-size:3rem;margin-bottom:1rem}
        .service-card h3{margin-bottom:1rem;color:#222}
        .contact{background:var(--dark);color:#fff;text-align:center}
        .contact h2{color:#fff}
        .contact-links{display:flex;flex-direction:column;gap:1rem;align-items:center;margin-top:2rem}
        .contact-links a{color:var(--accent);text-decoration:none;font-size:1.1rem;padding:10px 30px;border:2px solid var(--accent);border-radius:50px;transition:all .3s}
        .contact-links a:hover{background:var(--accent);color:var(--dark)}
        footer{text-align:center;padding:2rem;background:#111;color:#888;font-size:.9rem}
        [data-i18n]{transition:opacity .2s}
        .fade{opacity:0}
        @media(min-width:768px){.about-content{grid-template-columns:repeat(3,1fr)}.services-grid{grid-template-columns:repeat(3,1fr)}.contact-links{flex-direction:row;justify-content:center}.hamburger{display:none}.links{display:flex!important;position:static;flex-direction:row;width:auto;box-shadow:none;padding:0}.links a{margin:0 0 0 2rem;border:none;padding:0}.hero h1{font-size:3.5rem}}
        @media(min-width:768px)and (max-width:1024px){.about-content{grid-template-columns:repeat(2,1fr)}.services-grid{grid-template-columns:repeat(2,1fr)}}
    </style>
</head>
<body>
    <nav>
        <div class="nav-container">
            <div class="logo">Blatboy.dev</div>
            <div class="nav-right">
                <div class="lang-switcher">
                    <button class="lang-btn" onclick="toggleLang()"><span id="currentLang">🇷🇺 RU</span> ▼</button>
                    <div class="lang-dropdown" id="langDropdown">
                        <div class="lang-option" onclick="setLang('ru')"><span class="flag">🇷🇺</span> Русский</div>
                        <div class="lang-option" onclick="setLang('en')"><span class="flag">🇬🇧</span> English</div>
                        <div class="lang-option" onclick="setLang('es')"><span class="flag">🇪🇸</span> Español</div>
                    </div>
                </div>
                <button class="hamburger" onclick="toggleMenu()">☰</button>
                <div class="links" id="navLinks">
                    <a href="#about" onclick="closeMenu()" data-i18n="nav_about"></a>
                    <a href="#services" onclick="closeMenu()" data-i18n="nav_services"></a>
                    <a href="#contact" onclick="closeMenu()" data-i18n="nav_contact"></a>
                </div>
            </div>
        </div>
    </nav>

    <section class="hero">
        <div>
            <h1 data-i18n="hero_title"></h1>
            <p data-i18n="hero_subtitle"></p>
            <a href="#contact" class="btn" data-i18n="hero_cta"></a>
        </div>
    </section>

    <section class="about" id="about">
        <h2 data-i18n="about_title"></h2>
        <div class="about-content">
            <div class="about-card">
                <h3 data-i18n="about_card1_title"></h3>
                <p data-i18n="about_card1_text"></p>
            </div>
            <div class="about-card">
                <h3 data-i18n="about_card2_title"></h3>
                <p data-i18n="about_card2_text"></p>
            </div>
            <div class="about-card">
                <h3 data-i18n="about_card3_title"></h3>
                <p data-i18n="about_card3_text"></p>
            </div>
        </div>
    </section>

    <section id="services">
        <h2 data-i18n="services_title"></h2>
        <div class="services-grid">
            <div class="service-card">
                <div class="icon">🎨</div>
                <h3 data-i18n="service1_title"></h3>
                <p data-i18n="service1_text"></p>
            </div>
            <div class="service-card">
                <div class="icon">🛒</div>
                <h3 data-i18n="service2_title"></h3>
                <p data-i18n="service2_text"></p>
            </div>
            <div class="service-card">
                <div class="icon">⚡</div>
                <h3 data-i18n="service3_title"></h3>
                <p data-i18n="service3_text"></p>
            </div>
        </div>
    </section>

    <section class="contact" id="contact">
        <h2 data-i18n="contact_title"></h2>
        <p data-i18n="contact_subtitle"></p>
        <div class="contact-links">
            <a href="https://github.com/blatboy777" target="_blank">GitHub</a>
            <a href="mailto:nov76246@gmail.com">Email</a>
            <a href="https://t.me/Blatboy_777" target="_blank">Telegram</a>
        </div>
    </section>

    <footer>
        <span data-i18n="footer"></span>
    </footer>

    <script>
        const i18n = {
            ru: {
                nav_about: 'Обо мне', nav_services: 'Услуги', nav_contact: 'Контакты',
                hero_title: 'Я — будущий веб-разработчик',
                hero_subtitle: 'Создаю современные сайты с помощью AI. Учусь вайбкодингу, чтобы делать проекты для клиентов по всему миру.',
                hero_cta: 'Связаться со мной',

                about_card1_title: '🚀 Vibe Coding',
                about_card1_text: 'Использую AI для быстрой разработки. То, что раньше занимало недели, теперь делается за часы.',
                about_card2_title: '📱 Мобильная разработка',

                about_card3_text: 'Готовлю портфолио для работы с европейскими клиентами. Английский уровня B1.',
                services_title: 'Услуги',
                service1_title: 'Лендинги',
                service1_text: 'Современные одностраничные сайты для бизнеса, продуктов и услуг. Адаптивный дизайн, быстрая загрузка.',
                service2_title: 'Многостраничные сайты',
                service2_text: 'Полноценные сайты с несколькими страницами: главная, о компании, услуги, контакты, блог.',
                service3_title: 'Доработка сайтов',
                service3_text: 'Добавлю новые секции, изменю дизайн, оптимизирую скорость загрузки вашего существующего сайта.',
                contact_title: 'Связаться со мной',
                contact_subtitle: 'Открыт для сотрудничества и новых проектов',
                footer: '© 2026 Blatboy. Создано с помощью Vibe Coding.'
            },
            en: {
                nav_about: 'About', nav_services: 'Services', nav_contact: 'Contact',
                hero_title: 'I am a Future Web Developer',
                hero_subtitle: 'I create modern websites using AI. Learning vibe coding to deliver projects for clients worldwide.',
                hero_cta: 'Get in Touch',
                about_title: 'About Me',
                about_card1_title: '🚀 Vibe Coding',
                about_card1_text: 'Using AI for rapid development. What used to take weeks now takes hours.',
                about_card2_title: '📱 Mobile Development',
                about_card2_text: 'Working from my phone and planning to switch to a MacBook for even greater productivity.',
                about_card3_title: '🌍 International Market',
                about_card3_text: 'Building a portfolio to work with European clients. English level B1, learning Spanish.',
                services_title: 'Services',
                service1_title: 'Landing Pages',
                service1_text: 'Modern one-page websites for businesses, products and services. Responsive design, fast loading.',
                service2_title: 'Multi-page Websites',
                service2_text: 'Full websites with multiple pages: home, about, services, contacts, blog.',
                service3_title: 'Website Improvements',
                service3_text: 'I will add new sections, change the design, optimize the loading speed of your existing website.',
                contact_title: 'Contact Me',
                contact_subtitle: 'Open for collaboration and new projects',
                footer: '© 2026 Blatboy. Created with Vibe Coding.'
            },
            es: {
                nav_about: 'Sobre mí', nav_services: 'Servicios', nav_contact: 'Contacto',
                hero_title: 'Soy un Futuro Desarrollador Web',
                hero_subtitle: 'Creo sitios web modernos con IA. Aprendiendo vibe coding para hacer proyectos para clientes de todo el mundo.',
                hero_cta: 'Contactar',
                about_title: 'Sobre Mí',
                about_card1_title: '🚀 Vibe Coding',
                about_card1_text: 'Uso IA para desarrollo rápido. Lo que antes tomaba semanas, ahora se hace en horas.',
                about_card2_title: '📱 Desarrollo Móvil',
                about_card2_text: 'Trabajo desde el teléfono y planeo cambiar a MacBook para mayor productividad.',
                about_card3_title: '🌍 Mercado Internacional',
                about_card3_text: 'Preparando portafolio para trabajar con clientes europeos. Inglés nivel B1, aprendiendo español.',
                services_title: 'Servicios',
                service1_title: 'Landing Pages',
                service1_text: 'Sitios modernos de una página para negocios, productos y servicios. Diseño responsive, carga rápida.',
                service2_title: 'Sitios Multi-página',
                service2_text: 'Sitios web completos con varias páginas: inicio, nosotros, servicios, contacto, blog.',
                service3_title: 'Mejoras de Sitios',
                service3_text: 'Agregaré nuevas secciones, cambiaré el diseño, optimizaré la velocidad de carga de su sitio web.',
                contact_title: 'Contactarme',
                contact_subtitle: 'Abierto a colaboraciones y nuevos proyectos',
                footer: '© 2026 Blatboy. Creado con Vibe Coding.'
            }
        };

        const langNames = {ru: '🇷🇺 RU', en: '🇬🇧 EN', es: '🇪🇸 ES'};
        let currentLang = localStorage.getItem('siteLang') || 'ru';

        function updateText() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[currentLang][key]) {
                    el.classList.add('fade');
                    setTimeout(() => {
                        el.textContent = i18n[currentLang][key];
                        el.classList.remove('fade');
                    }, 200);
                }
            });
            document.getElementById('currentLang').textContent = langNames[currentLang] + ' ▼';
            document.querySelectorAll('.lang-option').forEach(opt => {
                opt.classList.toggle('active', opt.textContent.includes(langNames[currentLang].split(' ')[1]));
            });
            document.documentElement.lang = currentLang;
        }

        function setLang(lang) {
            currentLang = lang;
            localStorage.setItem('siteLang', lang);
            updateText();
            document.getElementById('langDropdown').classList.remove('show');
        }

        function toggleLang() {
            document.getElementById('langDropdown').classList.toggle('show');
        }

        function toggleMenu() {
            document.getElementById('navLinks').classList.toggle('active');
        }

        function closeMenu() {
            document.getElementById('navLinks').classList.remove('active');
        }

        document.querySelectorAll('a[href^="#"]').forEach(a => {
            a.addEventListener('click', function(e) {
                e.preventDefault();
                document.querySelector(this.getAttribute('href')).scrollIntoView({behavior: 'smooth'});
            });
        });

        document.addEventListener('click', e => {
            if (!e.target.closest('.lang-switcher')) document.getElementById('langDropdown').classList.remove('show');
        });

        updateText();
    </script>
</body>
</html>
