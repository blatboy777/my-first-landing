        /* ===== АНИМАЦИИ ===== */
        @keyframes fadeInUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
        @keyframes fadeInDown{from{opacity:0;transform:translateY(-30px)}to{opacity:1;transform:translateY(0)}}
        @keyframes scaleIn{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}
        @keyframes slideInLeft{from{opacity:0;transform:translateX(-60px)}to{opacity:1;transform:translateX(0)}}
        @keyframes slideInRight{from{opacity:0;transform:translateX(60px)}to{opacity:1;transform:translateX(0)}}
        @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
        .animate{opacity:0}
        .animate.visible{animation-fill-mode:forwards}
        .anim-fade-up.visible{animation:fadeInUp .8s ease forwards}
        .anim-fade-down.visible{animation:fadeInDown .8s ease forwards}
        .anim-scale.visible{animation:scaleIn .7s ease forwards}
        .anim-left.visible{animation:slideInLeft .8s ease forwards}
        .anim-right.visible{animation:slideInRight .8s ease forwards}
        .anim-float{animation:float 3s ease-in-out infinite}
        .delay-1{animation-delay:.1s}
        .delay-2{animation-delay:.2s}
        .delay-3{animation-delay:.3s}
        .delay-4{animation-delay:.4s}
        .delay-5{animation-delay:.5s}
        .hero h1{animation:fadeInDown 1s ease forwards}
        .hero p{animation:fadeInUp 1s ease .3s forwards;opacity:0}
        .hero .btn{animation:scaleIn .8s ease .6s forwards;opacity:0}

                service3_text: 'Agregaré nuevas secciones, cambiaré el diseño, optimizaré la velocidad de carga de su sitio web.',
                contact_title: 'Contactarme',
                contact_subtitle: 'Abierto a colaboraciones y nuevos proyectos',
                form_submit: 'Enviar Mensaje',
                footer: '© 2026 Blatboy. Creado con Vibe Coding.'
            }
        };

        const langNames = {ru: '🇷🇺 RU', en: '🇬🇧 EN', es: '🇪🇸 ES'};
        let currentLang = localStorage.getItem('siteLang') || 'ru';

        function updateText() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (i18n[currentLang][key]) {
                    el.classList.add('fade');
                    setTimeout(() => {
                        el.textContent = i18n[currentLang][key];
                        el.classList.remove('fade');
                    }, 200);
                }
            });
            document.getElementById('currentLang').textContent = langNames[currentLang] + ' ▼';
            document.querySelectorAll('.lang-option').forEach(opt => {
                opt.classList.toggle('active', opt.textContent.includes(langNames[currentLang].split(' ')[1]));
            });
            document.documentElement.lang = currentLang;
        }

        function setLang(lang) {
            currentLang = lang;
            localStorage.setItem('siteLang', lang);
            updateText();
            document.getElementById('langDropdown').classList.remove('show');
        }

        function toggleLang() {
            document.getElementById('langDropdown').classList.toggle('show');
        }

        function toggleMenu() {
            document.getElementById('navLinks').classList.toggle('active');
        }

        function closeMenu() {
            document.getElementById('navLinks').classList.remove('active');
        }

        document.querySelectorAll('a[href^="#"]').forEach(a => {
            a.addEventListener('click', function(e) {
                e.preventDefault();
                document.querySelector(this.getAttribute('href')).scrollIntoView({behavior: 'smooth'});
            });
        });

        document.addEventListener('click', e => {
            if (!e.target.closest('.lang-switcher')) document.getElementById('langDropdown').classList.remove('show');
        });

        // Анимации при скролле
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, { threshold: 0.15 });

        document.querySelectorAll('.animate').forEach(el => observer.observe(el));

        // Активная навигация при скролле
        const sections = document.querySelectorAll('section[id]');
        const navLinks = document.querySelectorAll('.links a[href^="#"]');
        const toTopBtn = document.getElementById('toTop');

        window.addEventListener('scroll', () => {
            let current = '';
            sections.forEach(section => {
                const sectionTop = section.offsetTop;
                if (scrollY >= sectionTop - 200) {
                    current = section.getAttribute('id');
                }
            });
            navLinks.forEach(link => {
                link.classList.remove('active');
                if (link.getAttribute('href') === '#' + current) {
                    link.classList.add('active');
                }
            });
            // Кнопка наверх
            if (window.scrollY > 500) {
                toTopBtn.classList.add('show');
            } else {
                toTopBtn.classList.remove('show');
            }
        });

        updateText();
    </script>
</body>
</html>
